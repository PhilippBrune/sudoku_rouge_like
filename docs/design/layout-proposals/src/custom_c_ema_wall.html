<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script><script src="modifiers.js"></script>
<style>
  /* Custom Puzzle · C · Shrine wall: every rule is a small ema plaque on a wooden wall, one shelf per family; the chosen
     rules hang on the red cord at the top. The board settings sit on the shrine's offering box at the bottom. */
  .bg { position:absolute; inset:0; background:url('../../../../Assets/Resources/background/bg_tutorial_setup.png') center/cover; filter:brightness(.38) saturate(.75); }
  .wall { position:absolute; left:70px; right:70px; top:210px; height:640px; border-radius:14px;
          background: repeating-linear-gradient(90deg, #5a3d24 0 120px, #533820 120px 240px); box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 10px #3d2716; }
  .cord { position:absolute; left:90px; right:90px; top:96px; height:4px; background:#b23a2e; border-radius:2px; }
  .head { position:absolute; left:90px; top:30px; font-size:40px; color:#f3e9cf; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .head small { font-size:18px; color:#cbbd9c; margin-left:16px; }
  .hung { position:absolute; top:96px; width:150px; text-align:center; }
  .hung .str { margin:0 auto; width:2px; height:18px; background:#b23a2e; }
  .ema { position:relative; margin:0 auto; width:120px; height:92px; clip-path: polygon(0 18%, 50% 0, 100% 18%, 100% 100%, 0 100%);
         background: linear-gradient(180deg, #edc68c, #b98652); display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
         padding-bottom:6px; color:#2a1a10; font-size:13px; line-height:1.1; }
  .ema img { width:44px; height:44px; object-fit:contain; margin-bottom:3px; }
  .ema.chosen { box-shadow: 0 0 0 3px #b23a2e inset; filter: drop-shadow(0 0 10px rgba(255,214,140,.7)); }
  .ema.empty { background: rgba(239,227,198,.12); border:2px dashed rgba(239,227,198,.4); clip-path:none; border-radius:8px; color:#cbbd9c; justify-content:center; }
  .shelf { position:absolute; left:100px; right:100px; height:96px; }
  .shelf .label { position:absolute; left:0; top:30px; width:150px; font-size:17px; letter-spacing:.08em; color:#f0dcb4; }
  .shelf .label b { display:block; font-weight:normal; font-size:14px; color:#c4a97a; }
  .shelf .row { position:absolute; left:160px; right:0; top:0; display:flex; gap:10px; overflow:hidden; }
  .shelf .more { position:absolute; right:-8px; top:30px; padding:4px 10px; border-radius:999px; background:#efe3c6; color:#231e17; font-size:15px; }
  .shelf .ema { width:104px; height:86px; flex:none; font-size:12px; }
  .shelf .ema img { width:38px; height:38px; }
  .box { position:absolute; left:70px; right:70px; top:880px; height:150px; border-radius:12px; background:linear-gradient(180deg,#6b4423,#3d2716);
         box-shadow:0 18px 40px rgba(0,0,0,.6); color:#f3e9cf; display:flex; align-items:center; gap:28px; padding:0 34px; font-size:20px; }
  .box .opt { padding:10px 18px; border-radius:10px; background:rgba(239,227,198,.12); }
  .box .opt b { font-weight:normal; color:#f2c46d; margin-left:8px; }
  .box .start { margin-left:auto; padding:16px 54px; border-radius:999px; background:#b23a2e; color:#fff; font-size:26px; }
</style></head><body>
<div class="bg"></div>
<div class="head">Custom Puzzle<small>Choose up to five rules · 3 hanging</small></div>
<div class="cord"></div>
<div id="hung"></div>
<div class="wall"></div>
<div id="shelves"></div>
<div class="box"><span class="opt">Size<b>9×9</b></span><span class="opt">Difficulty<b>★★★</b></span><span class="opt">Regions<b>Boxes</b></span>
  <span class="opt">Resources<b>Free</b></span><span class="opt">Back</span><span class="start">Start puzzle</span></div>
<div class="caption">Custom Puzzle · Proposal C · Shrine wall, one shelf per family (71 rules)</div>
<script>
  const all = MOD_FAMILIES.flatMap(f => f.mods);
  const hung = document.getElementById('hung');
  for (let i = 0; i < 5; i++) {
    const m = all.find(x => x[0] === MOD_CHOSEN[i]);
    hung.insertAdjacentHTML('beforeend', `<div class="hung" style="left:${640 + i * 170}px"><div class="str"></div>` +
      (m ? `<div class="ema chosen"><img src="${modIcon(m[1])}">${m[0]}</div>` : `<div class="ema empty">free</div>`) + '</div>');
  }
  const shelves = document.getElementById('shelves');
  MOD_FAMILIES.forEach((f, i) => {
    const shown = f.mods.slice(0, 13);
    const tiles = shown.map(([n, icon]) => `<div class="ema ${MOD_CHOSEN.includes(n) ? 'chosen' : ''}"><img src="${modIcon(icon)}">${n}</div>`).join('');
    const more = f.mods.length > shown.length ? `<span class="more">+${f.mods.length - shown.length} ›</span>` : '';
    shelves.insertAdjacentHTML('beforeend', `<div class="shelf" style="top:${226 + i * 104}px"><span class="label">${f.name}<b>${f.mods.length} rules</b></span>` +
      `<div class="row">${tiles}</div>${more}</div>`);
  });
</script>
</body></html>
