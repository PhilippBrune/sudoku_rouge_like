<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .bg { position:absolute; inset:0; background:url('../../../../Assets/Resources/background/bg_boss_gate.png') center/cover; filter: brightness(.42) saturate(.85); }
  .mist { position:absolute; inset:0; background: radial-gradient(ellipse at 58% 60%, rgba(0,0,0,0) 30%, rgba(8,6,6,.7) 100%); }
  .beam { position:absolute; left:640px; right:90px; top:150px; height:34px; border-radius:6px;
          background: linear-gradient(180deg, #2b1a14, #120a08); box-shadow: 0 10px 20px rgba(0,0,0,.6); border-bottom:3px solid #8c1f1c; }
  .ofuda { position:absolute; top:184px; width:236px; height:600px; padding:26px 22px 22px; text-align:center;
           background: linear-gradient(180deg, #f2e7cc, #e5d4ad); color:#231e17;
           box-shadow: 0 18px 30px rgba(0,0,0,.55); transform-origin: top center; }
  .ofuda::before { content:''; position:absolute; left:50%; top:-24px; width:3px; height:26px; background:#c9a24f; margin-left:-1px; }
  .ofuda .rim { position:absolute; inset:10px; border:3px solid #231e17; pointer-events:none; }
  .ofuda .rim::after { content:''; position:absolute; inset:5px; border:1px solid #231e17; }
  .ofuda img { width:120px; height:120px; object-fit:contain; margin:30px auto 18px; display:block; }
  .ofuda .name { font-size:28px; line-height:1.15; }
  .ofuda .rule { font-size:18px; line-height:1.35; margin-top:18px; color:#4a4134; }
  .ofuda.unknown { background: linear-gradient(180deg, #3a3330, #26201d); color:#e8dcc0; }
  .ofuda.unknown .rim, .ofuda.unknown .rim::after { border-color:#c9a24f; }
  .ofuda.unknown .rule { color:#cbbd9f; }
  .ofuda.unknown img { filter: grayscale(1) brightness(1.4); opacity:.7; }
  .ofuda.chosen { box-shadow: 0 0 0 4px #b23a2e, 0 18px 30px rgba(0,0,0,.55); }
  .stamp { position:absolute; right:14px; bottom:18px; width:96px; height:96px; border:5px solid #b23a2e; border-radius:12px;
           color:#b23a2e; font-size:16px; display:flex; align-items:center; justify-content:center; transform:rotate(-11deg);
           background: rgba(178,58,46,.08); letter-spacing:.02em; }
  .boss { position:absolute; left:90px; top:120px; width:470px; height:820px; padding:34px 36px;
          background: linear-gradient(180deg, #1f1715, #140e0c); border:2px solid #5a2a23; box-shadow:0 24px 50px rgba(0,0,0,.65); color:#f2e7cc; }
  .boss .face { width:250px; height:250px; margin:6px auto 0; border-radius:50%; background: radial-gradient(circle at 45% 40%, #4c2120, #1a0c0b);
                border:4px solid #b23a2e; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 40px rgba(178,58,46,.45); }
  .boss .face img { width:190px; height:190px; }
  .boss h2 { margin:20px 0 0; font-weight:normal; font-size:40px; text-align:center; }
  .boss .sub { text-align:center; font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:#c9a24f; margin-top:6px; }
  .flames { display:flex; justify-content:center; gap:16px; margin-top:26px; }
  .flame { width:34px; height:46px; border-radius:50% 50% 45% 45% / 62% 62% 38% 38%; background:#3a2a26; }
  .flame.on { background: radial-gradient(circle at 50% 65%, #ffe2a0, #f4a259 45%, #c8553d 80%); box-shadow:0 0 18px rgba(244,162,89,.75); }
  .intensity { text-align:center; margin-top:10px; font-size:19px; color:#e8dcc0; }
  .debuff { margin-top:34px; padding:16px 18px; border:2px solid #b23a2e; background: rgba(178,58,46,.12); display:flex; gap:16px; align-items:center; }
  .debuff img { width:62px; height:62px; flex:none; }
  .debuff b { display:block; font-weight:normal; color:#ff9d8c; font-size:20px; }
  .debuff span { font-size:17px; line-height:1.3; color:#e8dcc0; }
  .you { position:absolute; left:36px; right:36px; bottom:30px; padding-top:18px; border-top:1px solid #5a2a23; font-size:18px; line-height:1.5; color:#cbbd9f; text-align:center; }
  .you b { font-weight:normal; color:#f2e7cc; }
  .title { position:absolute; left:640px; top:56px; font-size:38px; color:#f2e7cc; }
  .title small { font-size:20px; color:#c9a24f; letter-spacing:.12em; margin-left:16px; text-transform:uppercase; }
  .confirm { position:absolute; left:1010px; top:868px; width:520px; height:84px; border-radius:12px; display:flex; align-items:center; justify-content:center;
             gap:16px; font-size:26px; color:#f2e7cc; background: linear-gradient(180deg, #9e2a2b, #6e1b1c); box-shadow: 0 10px 22px rgba(0,0,0,.55); opacity:.55; }
  .count { position:absolute; left:640px; top:892px; font-size:22px; color:#e8dcc0; }
</style></head><body>
<div class="bg"></div><div class="mist"></div>
<div class="title">Choose the trials<small>pick 3 of 4</small></div>
<div class="beam"></div>
<div id="ofuda"></div>
<div class="count" id="count"></div>
<div class="confirm">Face the Shrine Oni</div>
<div class="boss">
  <div class="sub">Floor three · Koi Terrace</div>
  <div class="face"><img src="../../../../Assets/Resources/boss/icon_shrine_oni.png"></div>
  <h2>Shrine Oni</h2>
  <div class="flames" id="flames"></div>
  <div class="intensity" id="intensity"></div>
  <div class="debuff"><img id="dicon"><div><b id="dname"></b><span id="drule"></span></div></div>
  <div class="you">You go in with <b>HP 7 / 10</b> · <b>Pencil 8 / 10</b><br>Bag: Solver, Bamboo Scroll</div>
</div>
<div class="caption">Boss modifiers · Proposal A · Talismans at the gate</div>
<script src="common.js"></script>
<script>
  const box = document.getElementById('ofuda');
  GATE.options.forEach((o, i) => {
    const el = document.createElement('div');
    el.className = 'ofuda' + (o.chosen ? ' chosen' : '') + (o.unknown ? ' unknown' : '');
    el.style.left = (650 + i * 290) + 'px';
    el.style.transform = `rotate(${[-1.2, 0.8, -0.6, 1.1][i]}deg)`;
    el.innerHTML = `<div class="rim"></div><img src="${o.icon}"><div class="name">${o.name}</div><div class="rule">${o.rule}</div>` +
                   (o.chosen ? '<div class="stamp">CHOSEN</div>' : '');
    box.appendChild(el);
  });
  document.getElementById('count').textContent = `${GATE.chosen} of ${GATE.pick} chosen`;
  document.getElementById('flames').innerHTML = [1, 2, 3, 4].map(n => `<div class="flame ${n <= GATE.intensity.level ? 'on' : ''}"></div>`).join('');
  document.getElementById('intensity').textContent = `Intensity: ${GATE.intensity.name}`;
  document.getElementById('dicon').src = GATE.debuff.icon;
  document.getElementById('dname').textContent = 'Boss debuff · ' + GATE.debuff.name;
  document.getElementById('drule').textContent = GATE.debuff.rule;
</script>
</body></html>
