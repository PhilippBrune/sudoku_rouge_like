<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="scenes.css">
<style>
  /* RM-101 (owner 2026-11-04, "week and month"): the board of the month or week with an All / Friends switch. Shown on
     the Monthly Walk's result; the same slip goes on the Garden Run's end (seed of the week), the Game Modes slips, and
     the Daily Walk and Incense Walk boards. ?v=a|b|c picks the proposal, &tab=friends shows the friends' side. */
  .bg { background-image:url('../../../../Assets/Resources/background/bg_monthly_walk.png'); }
  .tally { position:absolute; left:308px; top:238px; width:594px; height:694px; padding:56px 60px 0; color:#231e17;
           background: linear-gradient(180deg, #f3e9cf, #e8d8b2); box-shadow:0 30px 60px rgba(0,0,0,.6); }
  .tally::before, .tally::after { content:''; position:absolute; left:0; right:0; height:20px;
           background: repeating-linear-gradient(90deg, #2c4632 0 16px, #33523a 16px 32px); border-top:2px solid #c9a24f; border-bottom:2px solid #c9a24f; }
  .tally::before { top:0; } .tally::after { bottom:0; }
  .tally small { display:block; font-size:16px; letter-spacing:.14em; color:#6b5f4c; }
  .tally .rows { margin-top:14px; font-size:24px; line-height:2.45; color:#3a3228; }
  .tally .rows span { float:right; color:#231e17; }
  .grade { position:absolute; left:1018px; top:238px; width:594px; height:250px; padding:40px 42px; background:rgba(20,15,10,.78);
           border:1px solid rgba(201,162,79,.5); border-radius:14px; color:#f3e9cf; }
  .grade small { font-size:16px; letter-spacing:.14em; color:#cbbd9c; }
  .grade b { display:block; font-weight:normal; font-size:76px; color:#e9c46a; line-height:1.2; }
  .grade p { margin:0; font-size:20px; }
  .board { position:absolute; left:1018px; top:520px; width:594px; height:330px; padding:30px 40px; background:#efe3c6; color:#231e17;
           box-shadow:0 14px 28px rgba(0,0,0,.5); }
  .board small { font-size:15px; letter-spacing:.14em; color:#6b5f4c; }
  .board .place { font-size:40px; margin:4px 0 6px; } .board .place em { font-style:normal; font-size:20px; color:#6b5f4c; }
  .board .r { display:flex; justify-content:space-between; font-size:21px; line-height:1.75; }
  .board .r span { color:#3a3228; } .board .me { color:#9e2a2b; }
  /* A: bookmarks on the slip's top edge, as on the Options scroll */
  .tabs { position:absolute; left:1046px; top:476px; display:flex; gap:8px; }
  .tabs div { padding:9px 26px 12px; border-radius:10px 10px 0 0; font-size:19px; background:#5b4632; color:#e9dcc0; }
  .tabs div.on { background:#efe3c6; color:#231e17; }
  .tabs .key { margin-left:8px; width:26px; height:26px; font-size:14px; }
  /* B: the Solve / Pencil switch of the puzzle under the slip */
  .switch { position:absolute; left:1150px; top:868px; width:330px; height:46px; border-radius:23px; background:#2a1d12;
            border:2px solid #c9a24f; display:flex; overflow:hidden; font-size:20px; }
  .switch div { flex:1; display:flex; align-items:center; justify-content:center; color:#e9dcc0; }
  .switch div.on { background:#c9963c; color:#2a1a10; }
  /* C: both lists side by side */
  .cols { display:flex; gap:34px; }
  .cols > div { flex:1; } .cols h4 { margin:2px 0 4px; font-weight:normal; font-size:15px; letter-spacing:.14em; color:#6b5f4c; }
  .cols .r { font-size:19px; line-height:1.7; }
  .btnrow { position:absolute; left:1190px; top:946px; }
  .label { position:absolute; left:40px; top:30px; padding:8px 18px; border-radius:999px; background:rgba(0,0,0,.7); color:#fff;
           font:600 20px 'Segoe UI', sans-serif; }
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="banner" style="top:40px"><small>Monthly Walk · The Old Tree Grove</small><h1>Grade A</h1></div>
<div class="tally"><small>THIS TIME</small>
  <div class="rows">Score <span>8,000</span><br>Cells correct <span>52</span><br>Mistakes <span>2</span><br>Pencil left <span>10 / 10</span><br>Time <span>12:34</span></div></div>
<div class="grade"><small>GRADE</small><b>A</b><p>Score 8,000 · your first walk this month</p></div>
<div id="board" class="board"></div>
<div id="extra"></div>
<div class="btnrow"><span class="btn main">Back to the garden gate</span></div>
<div id="label" class="label"></div>
<div class="hint" style="top:1028px" id="hint"></div>
<script>
const q = new URLSearchParams(location.search), v = q.get('v') || 'a', friends = q.get('tab') === 'friends';
const all = { head: "THE MONTH'S BOARD · 128 WALKERS", place: 'Place 12 <em>of 128</em>',
  rows: [['1. Hanako', '9,640'], ['2. kintsugi_kai', '9,410'], ['3. Moritz', '9,180']], me: ['12. You', '8,000'] };
const fr = { head: 'AMONG FRIENDS · 5 WALKED', place: 'Place 2 <em>of 5</em>',
  rows: [['1. Moritz', '9,180'], ['2. You', '8,000'], ['3. Lea', '7,240'], ['4. tomo', '6,900']], me: null };
const list = d => d.rows.map(r => `<div class="r${r[0].endsWith('You') ? ' me' : ''}">${r[0]}<span>${r[1]}</span></div>`).join('')
  + (d.me ? `<div class="r me">${d.me[0]}<span>${d.me[1]}</span></div>` : '');
const board = document.getElementById('board'), extra = document.getElementById('extra');
if (v === 'c') {
  board.innerHTML = `<small>THE MONTH'S BOARD · 128 WALKERS · 5 FRIENDS</small>
    <div class="cols"><div><h4>EVERYONE · PLACE 12</h4>${list(all)}</div><div><h4>FRIENDS · PLACE 2</h4>${list(fr)}</div></div>`;
  document.getElementById('label').textContent = 'C · both lists side by side, no switch';
  document.getElementById('hint').textContent = 'A back to the garden gate';
} else {
  const d = friends ? fr : all;
  board.innerHTML = `<small>${d.head}</small><div class="place">${d.place}</div>${list(d)}`;
  if (v === 'a') {
    extra.innerHTML = `<div class="tabs"><div class="${friends ? '' : 'on'}">All</div><div class="${friends ? 'on' : ''}">Friends<span class="key">Y</span></div></div>`;
    document.getElementById('label').textContent = 'A · bookmarks on the slip' + (friends ? ' (Friends)' : ' (All)');
  } else {
    extra.innerHTML = `<div class="switch"><div class="${friends ? '' : 'on'}">All</div><div class="${friends ? 'on' : ''}">Friends</div></div>`;
    board.style.height = '330px';
    document.getElementById('label').textContent = 'B · the Solve / Pencil switch under the slip' + (friends ? ' (Friends)' : ' (All)');
  }
  document.getElementById('hint').innerHTML = 'Y / F all or friends · A back to the garden gate';
}
</script>
</body></html>
